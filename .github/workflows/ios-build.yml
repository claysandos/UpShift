# Save as: .github/workflows/ios-build.yml
name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:        # lets you run it from the Actions tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: upshift
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Creates ios/Flutter/Generated.xcconfig (needed by CocoaPods).
      - name: Generate iOS config
        run: flutter build ios --config-only --no-codesign

      # Windows never creates ios/Podfile, and --config-only doesn't either,
      # so copy Flutter's own template, then turn on Bluetooth for
      # permission_handler and install pods.
      - name: Set up Podfile with Bluetooth enabled
        run: |
          FLUTTER_ROOT=$(dirname "$(dirname "$(which flutter)")")
          if [ ! -f ios/Podfile ]; then
            cp "$FLUTTER_ROOT/packages/flutter_tools/templates/cocoapods/Podfile-ios-swift" ios/Podfile
          fi
          python3 - <<'PYEOF'
          p = 'ios/Podfile'
          s = open(p).read()
          if 'PERMISSION_BLUETOOTH' not in s:
              patch = """flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] ||= ['$(inherited)', 'PERMISSION_BLUETOOTH=1']
              end"""
              s = s.replace('flutter_additional_ios_build_settings(target)', patch, 1)
              open(p, 'w').write(s)
          PYEOF
          cd ios && pod install

      - name: Build
        run: flutter build ios --release --no-codesign

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry upshift.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: upshift-ios
          path: upshift/upshift.ipa
